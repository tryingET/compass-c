[project]
name = "compass-c"
version = "0.6.0"
description = "Computational decision support with bounded, revisable evidence records"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "tryingET" }]
dependencies = []
keywords = ["decision-support", "metacognition", "agent-skill", "sqlite"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/tryingET/compass-c"
Repository = "https://github.com/tryingET/compass-c"
Issues = "https://github.com/tryingET/compass-c/issues"

[project.scripts]
compass-c = "compass_c.cli:main"
compass = "compass_c.cli:main"
compass-c-mcp = "compass_c.mcp_server:main"

[project.optional-dependencies]
mcp = ["mcp==2.1.1", "pydantic>=2,<3"]
dev = [
    "build>=1.2",
    "hatchling>=1.32,<2",
    "pytest>=8.0",
    "pyyaml>=6,<7",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
    ".ontology/**", ".compass/**",
    ".pytest_cache/**", ".ruff_cache/**",
    "*.db", "*.sqlite", "*.sqlite3",
    "*.db-*", "*.sqlite-*", "*.sqlite3-*",
]

[tool.hatch.build.targets.wheel]
packages = ["src/compass_c"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["tools/rocs-cli"]
# Exact bytes are pinned by the retained jury readback (evals/dspx-jury/subscription-result.json).
extend-exclude = [
    "evals/dspx-jury/program/*.py",
    "scripts/compass_jury.py",
    "scripts/compass_jury_budget.py",
    "scripts/compass_jury_envelope.py",
    "scripts/compass_jury_live.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Repository-root helpers (install_skill, scripts.*) import under bare `pytest` too.
pythonpath = ["."]

[tool.uv]
# Project-level quarantine: uv.lock records its resolution options, so declaring the
# quarantine here keeps the lock identical with or without a user-level
# ~/.config/uv/uv.toml (engineering-core AK5775/AK5998).
exclude-newer = "7 days"
