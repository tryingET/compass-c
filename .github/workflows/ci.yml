name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - name: Install locked development environment
        run: uv sync --extra dev --locked
      - name: Check formatting and lint
        run: |
          uv run ruff format --check .
          uv run ruff check .
      - name: Verify generated skill and package
        run: |
          uv run python scripts/build_skill.py --check
          uv run python scripts/validate_skill.py
          uv run python scripts/build_archives.py --check-plugin
      - name: Run tests
        run: uv run python -m pytest tests/ -v --tb=short
      - name: Build distributions
        run: |
          uv run python -m build
          uv run python scripts/build_archives.py
