name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The document policy compares the posture baseline with later history.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - name: Install locked development environment
        run: uv sync --extra dev --locked
      - name: Check formatting and lint
        run: |
          uv run ruff format --check .
          uv run ruff check .
      - name: Verify generated skill and package
        run: |
          uv run python scripts/build_skill.py --check
          uv run python scripts/validate_skill.py
          uv run python scripts/build_archives.py --check-plugin
      - name: Run tests
        run: uv run python -m pytest tests/ -v --tb=short
      - name: Check document freshness policy
        run: ./scripts/check-document-policy.sh
      - name: Build distributions
        run: |
          uv run python -m build
          uv run python scripts/build_archives.py
      - name: Verify the standalone wheel without optional dependencies
        run: |
          uv venv --python "${{ matrix.python-version }}" "$RUNNER_TEMP/compass-core"
          uv pip install --python "$RUNNER_TEMP/compass-core/bin/python" --no-deps dist/compass_c-*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/compass-core/bin/python" -I -m compass_c calculate brier --parameters '{"probabilities":[0.8],"outcomes":[1]}'

  mcp-wheel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - name: Install pinned SDK and test environment
        run: uv sync --extra dev --extra mcp --locked
      - name: Build and install the wheel in an isolated environment
        run: |
          uv build --wheel
          uv export --extra mcp --no-dev --no-emit-project --locked --output-file "$RUNNER_TEMP/mcp-requirements.txt" > /dev/null
          uv venv --python "${{ matrix.python-version }}" "$RUNNER_TEMP/compass-wheel"
          uv pip install --python "$RUNNER_TEMP/compass-wheel/bin/python" --require-hashes --requirement "$RUNNER_TEMP/mcp-requirements.txt"
          uv pip install --python "$RUNNER_TEMP/compass-wheel/bin/python" --no-deps dist/compass_c-*.whl
      - name: Verify genuine stdio sessions against the installed wheel
        env:
          COMPASS_MCP_PYTHON: ${{ runner.temp }}/compass-wheel/bin/python
        run: uv run --extra dev --extra mcp --locked python -m pytest tests/test_mcp_integration.py tests/test_horizon_interfaces.py tests/test_lifecycle_interfaces.py -v --tb=short
      - name: Verify stdio transport through the generated host configuration
        run: uv run --extra dev --extra mcp --locked python -m pytest tests/test_mcp_live.py -v --tb=short
